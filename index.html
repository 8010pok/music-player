<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
  <meta name="theme-color" content="#000000" />
  <meta name="description" content="ローカル音源を再生し、Last.fmにスクロブル・自分の統計を表示する統合PWA" />

  <!--
    [推奨ハードニング] Content-Security-Policy (多層防御)。出力は escapeHtml 済みだが、CSP を入れると
    XSS の被害を更に限定できる。下記は本アプリの実 fetch/読込先に合わせた起点案。導入時は必ずプレビューで
    全機能(再生=media blob / アートワーク=img blob+data+Last.fm CDN / 統計取得=connect ws.audioscrobbler.com /
    Chart.js=script jsdelivr / Worker=worker self / インライン style 属性)を検証してから有効化すること
    (誤指定は表示・再生・取得を黙って壊す)。未検証のまま有効化しないため現状はコメントとして残す:
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https:; media-src 'self' blob:; connect-src 'self' https://ws.audioscrobbler.com; worker-src 'self'; manifest-src 'self'; base-uri 'self'">
  -->

  <!-- iOS PWA 対応 -->
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="MUSIC-PLAYER" />
  <!--
    iOS / iPadOS のホーム画面追加用アイコン
    - sizes 指定で iPhone / iPad / iPad Pro それぞれに最適な解像度が使われる
    - sizes 無しの apple-touch-icon は最後のフォールバック (180×180)
  -->
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon-180.png" />
  <link rel="apple-touch-icon" sizes="167x167" href="icons/apple-touch-icon-167.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="icons/apple-touch-icon-152.png" />
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />

  <link rel="manifest" href="manifest.json" />

  <!-- PC ブラウザ用 favicon (タブ・ブックマーク) -->
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
  <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="icons/favicon-16.png" />
  <link rel="shortcut icon" href="icons/favicon.ico" />

  <title>MUSIC-PLAYER</title>

  <link rel="stylesheet" href="css/theme.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/views.css" />
</head>
<body>
  <!-- ============================================================
       常駐オーディオ要素：iOS バックグラウンド再生の生命線。
       絶対にビューと一緒に再生成しないこと。
       AudioContext を音声経路に挟むとロック画面で停止するため、
       これは独立した最上位ノードとして DOM に常駐させる。
       ============================================================ -->
  <audio id="audio-el" preload="metadata" playsinline></audio>

  <!-- 全体ヘッダー（タイトル + 状態表示 + 統計取得進捗） -->
  <header class="app-header" role="banner">
    <h1 class="app-title">MUSIC-PLAYER</h1>
    <div class="header-pills">
      <div class="stats-progress-pill" id="stats-progress-pill" aria-live="polite" hidden></div>
      <div class="status-pill" id="status-pill" aria-live="polite"></div>
    </div>
  </header>

  <!-- メインビュー領域：ルーターがここに各ビューを挿入 -->
  <main id="view-root" class="view-root" role="main"></main>

  <!-- ミニプレイヤー：再生画面以外のタブで再生情報を表示 -->
  <section id="mini-player" class="mini-player" hidden aria-label="ミニプレイヤー">
    <div class="mini-progress-track">
      <div id="mini-progress-fill" class="mini-progress-fill"></div>
    </div>
    <img id="mini-art" class="mini-art" alt="" />
    <div class="mini-meta">
      <div id="mini-title" class="mini-title">—</div>
      <div id="mini-artist" class="mini-artist">—</div>
    </div>
    <div class="mini-controls">
      <button id="mini-prev" class="icon-btn mini-btn" aria-label="前の曲">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zm3.5 6 8.5 6V6z"/></svg>
      </button>
      <button id="mini-play" class="icon-btn mini-btn" aria-label="再生/停止">
        <svg class="ic ic-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z"/></svg>
        <svg class="ic ic-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zm8 0h4v14h-4z"/></svg>
      </button>
      <button id="mini-next" class="icon-btn mini-btn" aria-label="次の曲">
        <svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 18l8.5-6L6 6v12zM16 6h2v12h-2z"/></svg>
      </button>
    </div>
  </section>

  <!-- ボトムナビゲーション（モバイルファースト） -->
  <nav class="bottom-nav" role="navigation" aria-label="メインメニュー">
    <a href="#/player" class="nav-item" data-route="player">
      <span class="nav-icon">
        <svg class="nav-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm-2 14.5v-9l6 4.5-6 4.5z"/></svg>
      </span>
      <span class="nav-label">再生中</span>
    </a>
    <a href="#/library" class="nav-item" data-route="library">
      <span class="nav-icon">
        <svg class="nav-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 6H2v14c0 1.1.9 2 2 2h14v-2H4V6zm16-4H8c-1.1 0-2 .9-2 2v12c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V4c0-1.1-.9-2-2-2zm-2 10-2.5-1.5L13 12V6h5v2h-3v4z"/></svg>
      </span>
      <span class="nav-label">ライブラリ</span>
    </a>
    <a href="#/playlists" class="nav-item" data-route="playlists">
      <span class="nav-icon">
        <svg class="nav-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M15 6H3v2h12V6zm0 4H3v2h12v-2zM3 16h8v-2H3v2zM17 6v8.18c-.31-.11-.65-.18-1-.18-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3V8h3V6h-5z"/></svg>
      </span>
      <span class="nav-label">リスト</span>
    </a>
    <a href="#/stats" class="nav-item" data-route="stats">
      <span class="nav-icon">
        <svg class="nav-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 9.2h3V19H5zM10.6 5h2.8v14h-2.8zm5.6 8H19v6h-2.8z"/></svg>
      </span>
      <span class="nav-label">統計</span>
    </a>
    <a href="#/settings" class="nav-item" data-route="settings">
      <span class="nav-icon">
        <svg class="nav-ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M19.14 12.94c.04-.3.06-.61.06-.94 0-.32-.02-.64-.07-.94l2.03-1.58a.49.49 0 0 0 .12-.61l-1.92-3.32a.488.488 0 0 0-.59-.22l-2.39.96c-.5-.38-1.03-.7-1.62-.94l-.36-2.54a.484.484 0 0 0-.48-.41h-3.84c-.24 0-.43.17-.47.41l-.36 2.54c-.59.24-1.13.57-1.62.94l-2.39-.96c-.22-.08-.47 0-.59.22L2.74 8.87c-.12.21-.08.47.12.61l2.03 1.58c-.05.3-.09.63-.09.94s.02.64.07.94l-2.03 1.58a.49.49 0 0 0-.12.61l1.92 3.32c.12.22.37.29.59.22l2.39-.96c.5.38 1.03.7 1.62.94l.36 2.54c.05.24.24.41.48.41h3.84c.24 0 .44-.17.47-.41l.36-2.54c.59-.24 1.13-.56 1.62-.94l2.39.96c.22.08.47 0 .59-.22l1.92-3.32c.12-.22.07-.47-.12-.61l-2.01-1.58zM12 15.6c-1.98 0-3.6-1.62-3.6-3.6s1.62-3.6 3.6-3.6 3.6 1.62 3.6 3.6-1.62 3.6-3.6 3.6z"/></svg>
      </span>
      <span class="nav-label">設定</span>
    </a>
  </nav>

  <!-- トースト通知領域 -->
  <div id="toast-root" class="toast-root" aria-live="polite"></div>

  <!-- モーダル領域 -->
  <div id="modal-root" class="modal-root" hidden></div>

  <!--
    Chart.js (統計画面で使用、SW でキャッシュ可能)
    crossorigin="anonymous": CDN へのクレデンシャル(Cookie等)送信を防ぐ
    referrerpolicy="no-referrer": Referer ヘッダから本サイトURL を CDN に漏らさない
    バージョンを 4.4.4 にピン留めして、CDN 上でファイル差し替えが起きても URL は変わらないようにしている
    ※ SRI(integrity 属性)は未付与。改ざん検知を強化するなら jsdelivr の SRI ハッシュ
      (sha384-…)を integrity に付与する(初回のみ正値の取得が必要。誤ハッシュは読込失敗を招くため別途対応)。
  -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"
          crossorigin="anonymous"
          referrerpolicy="no-referrer"
          defer></script>

  <!-- エントリポイント -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
