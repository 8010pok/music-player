<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 背景グラデーション -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0c16"/>
      <stop offset="50%" stop-color="#121524"/>
      <stop offset="100%" stop-color="#181c30"/>
    </linearGradient>

    <!-- ネオングロー用グラデーション -->
    <radialGradient id="auraPink" cx="35%" cy="38%" r="60%">
      <stop offset="0%" stop-color="#fa2d55" stop-opacity="0.45"/>
      <stop offset="60%" stop-color="#a855f7" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#0a0c16" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="auraCyan" cx="68%" cy="65%" r="55%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.35"/>
      <stop offset="50%" stop-color="#3b82f6" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0a0c16" stop-opacity="0"/>
    </radialGradient>

    <!-- サウンドバーのネオングラデーション -->
    <linearGradient id="barGrad1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fa2d55"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <linearGradient id="barGrad2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#e11d48"/>
      <stop offset="100%" stop-color="#c026d3"/>
    </linearGradient>
    <linearGradient id="barGrad3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="50%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="barGrad4" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <linearGradient id="barGrad5" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#2dd4bf"/>
    </linearGradient>

    <!-- プレイトライアングルのグラスグラデーション -->
    <linearGradient id="playGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#e0e7ff" stop-opacity="0.80"/>
    </linearGradient>

    <!-- シャドウフィルター -->
    <filter id="glowFilter" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#000000" flood-opacity="0.6"/>
    </filter>
  </defs>

  <!-- 背景 -->
  <rect width="512" height="512" fill="url(#bgGrad)"/>
  <rect width="512" height="512" fill="url(#auraPink)"/>
  <rect width="512" height="512" fill="url(#auraCyan)"/>

  <!-- 微細な外枠ハイライト -->
  <rect x="1.5" y="1.5" width="509" height="509" fill="none" stroke="rgba(255,255,255,0.12)" stroke-width="3"/>

  <!-- センター・グローサークル -->
  <circle cx="256" cy="256" r="140" fill="url(#auraPink)" opacity="0.8"/>

  <!-- 音楽イコライザーウェーブ（5本） -->
  <g filter="url(#glowFilter)">
    <!-- Bar 1 -->
    <rect x="132" y="216" width="28" height="80" rx="14" fill="url(#barGrad1)"/>
    <!-- Bar 2 -->
    <rect x="182" y="166" width="28" height="180" rx="14" fill="url(#barGrad2)"/>
    <!-- Bar 3 (中央背面の高波) -->
    <rect x="232" y="116" width="28" height="280" rx="14" fill="url(#barGrad3)"/>
    <!-- Bar 4 -->
    <rect x="282" y="156" width="28" height="200" rx="14" fill="url(#barGrad4)"/>
    <!-- Bar 5 -->
    <rect x="332" y="206" width="28" height="100" rx="14" fill="url(#barGrad5)"/>
  </g>

  <!-- グラスモーフィズム調 プレイトライアングル (前景中央) -->
  <g filter="url(#iconShadow)">
    <!-- 丸みを帯びたグラスプレート (バッジ) -->
    <circle cx="256" cy="256" r="88" fill="rgba(15, 18, 30, 0.72)" stroke="rgba(255, 255, 255, 0.22)" stroke-width="2.5"/>
    <!-- 鮮やかな再生シンボル -->
    <path d="M 234 212 C 234 205.5 241.2 201.5 246.8 205.0 L 296.8 237.0 C 302.2 240.4 302.2 248.4 296.8 251.8 L 246.8 283.8 C 241.2 287.3 234 283.3 234 276.8 Z" fill="url(#playGlass)"/>
  </g>
</svg>
